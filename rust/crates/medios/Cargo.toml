[package]
name = "medios"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "medios"
path = "src/lib.rs"

[[bin]]
name = "fake-ytdlp"
path = "tests/fixtures/fake_ytdlp.rs"

[dependencies]
nucleo = { path = "../nucleo" }
percent-encoding = "2.3"
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
thiserror = "1.0"
tokio = { version = "1", features = ["sync", "time", "process", "io-util", "rt"] }
tracing = "0.1"
url = "2.5"

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1", features = ["full"] }

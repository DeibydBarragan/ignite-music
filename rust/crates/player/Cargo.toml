[package]
name = "player"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
medios = { path = "../medios" }
nucleo = { path = "../nucleo" }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
songbird = { version = "=0.6.0", default-features = false, features = ["driver", "gateway", "receive", "tungstenite", "rustls", "twilight"] }
symphonia = { version = "=0.5.2", default-features = false, features = ["wav", "pcm", "aac", "alac", "flac", "mp3", "vorbis", "adpcm", "isomp4", "mkv", "ogg"] }
thiserror = "1.0"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
tracing = "0.1"
twilight-gateway = "0.17"
twilight-http = "0.17"
twilight-model = "0.17"

[dev-dependencies]
dotenvy = "0.15"
sha2 = "0.10"
tempfile = "3.10"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

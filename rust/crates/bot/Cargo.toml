[package]
name = "bot"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
nucleo = { path = "../nucleo" }
voice = { path = "../voice" }
player = { path = "../player" }
medios = { path = "../medios" }
songbird = { version = "=0.6.0", default-features = false, features = ["driver", "gateway", "receive", "tungstenite", "rustls", "twilight"] }
symphonia = { version = "=0.5.2", default-features = false, features = ["wav", "pcm", "aac", "alac", "flac", "mp3", "vorbis", "adpcm", "isomp4", "mkv", "ogg"] }
twilight-gateway = "0.17"
twilight-http = "0.17"
twilight-model = "0.17"
twilight-cache-inmemory = { version = "0.17", default-features = false, features = ["permission-calculator"] }
tokio = { version = "1", features = ["full", "test-util"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
futures-util = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
fastrand = "2"
url = "2.5"
regex = "1.10"
axum = "=0.8.9"
tower-http = { version = "=0.6.11", features = ["cors"] }
zip = { version = "2.6.1", default-features = false, features = ["deflate", "flate2"] }
flate2 = "1.0"

[dev-dependencies]
tempfile = "3.10"

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      # --ignore-scripts skips postinstall (yt-dlp/ffmpeg/cloudflared downloads):
      # tests never need the binaries.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Syntax check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Dependency audit
        run: npm run audit
